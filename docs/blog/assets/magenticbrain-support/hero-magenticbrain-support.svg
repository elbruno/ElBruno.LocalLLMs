<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MagenticBrain support hero</title>
  <desc id="desc">Developer laptop, local ONNX runtime chip, and MagenticBrain node connected in a C# workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1b1f38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1240" cy="230" r="120" fill="#1f2a55" stroke="#a78bfa" stroke-width="4"/>
  <path d="M1180 230c30-46 90-46 120 0s90 46 120 0" fill="none" stroke="#c4b5fd" stroke-width="6"/>
  <text x="1240" y="270" text-anchor="middle" fill="#ddd6fe" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">MagenticBrain</text>
  <rect x="650" y="340" width="300" height="160" rx="14" fill="#12203f" stroke="#60a5fa" stroke-width="3"/>
  <text x="800" y="410" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">ONNX Runtime</text>
  <text x="800" y="450" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="24">Local inference</text>
  <rect x="180" y="300" width="360" height="250" rx="16" fill="#101827" stroke="#334155" stroke-width="3"/>
  <rect x="210" y="335" width="300" height="160" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="360" y="395" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="30">C# app</text>
  <text x="360" y="435" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="22">LocalChatClient</text>
  <path d="M540 425h110" stroke="url(#accent)" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M950 340l170-80" stroke="url(#accent)" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M1120 310l-155 60" stroke="#67e8f9" stroke-width="6" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#67e8f9"/>
    </marker>
  </defs>
  <text x="800" y="800" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">
    ElBruno.LocalLLMs + MagenticBrain
  </text>
</svg>
