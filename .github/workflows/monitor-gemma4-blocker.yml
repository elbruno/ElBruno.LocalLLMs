# Retired Gemma 4 monitor
#
# Gemma 4 support is resolved. This workflow stays as a manual-only record so
# the repository has a single canonical terminal state and no daily job can
# reopen or duplicate tracker issues.

name: Gemma 4 Monitor (retired)

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional note displayed in the run summary.
        required: false
        default: Gemma 4 is resolved; the daily monitor has been retired.
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Publish retirement summary
        uses: actions/github-script@v7
        env:
          NOTE: ${{ inputs.note }}
        with:
          script: |
            const note = process.env.NOTE || 'Gemma 4 is resolved; the daily monitor has been retired.';
            await core.summary
              .addHeading('Gemma 4 monitor retired')
              .addRaw([
                '✅ Gemma 4 is resolved.',
                '',
                note,
                '',
                'Canonical tracker: issue #39 (closed).',
                'Canonical docs: `docs/blocked-models.md` and `docs/supported-models.md`.',
                '',
                'Terminal-state pattern for future monitors:',
                '- keep a single canonical issue for the monitor id',
                '- stop scheduled polling once the source of truth is resolved',
                '- close the canonical issue, then leave only a manual retirement stub',
              ].join(String.fromCharCode(10)))
              .write();
